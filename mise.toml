[tools]
ffmpeg = "8.1.2"
node = "22"
pnpm = "11.17.0"

[tasks.install]
description = "Install the pinned game, browser, media, and video dependencies"
run = """
pnpm install --frozen-lockfile
pnpm exec playwright install chromium
pnpm --dir video install --frozen-lockfile
pnpm --dir video exec remotion browser ensure
"""

[tasks.dev]
description = "Start the Vite development server"
run = "pnpm dev"

[tasks.build]
description = "Build the production web bundle"
run = "pnpm build"

[tasks.test]
description = "Run domain and content tests"
run = "pnpm test"

[tasks.typecheck]
description = "Type-check without emitting JavaScript"
run = "pnpm typecheck"

[tasks.lint]
description = "Run ESLint"
run = "pnpm lint"

[tasks.format]
description = "Check source formatting"
run = "pnpm format"

[tasks."assets:launch-placeholders"]
description = "Regenerate Phaser-safe opaque launch-roster placeholder PNGs"
run = "pnpm assets:launch-placeholders"

[tasks."assets:launch-roster"]
description = "Build reviewed launch-roster production art without silent overwrite"
run = "pnpm assets:launch-roster"

[tasks."assets:trophies"]
description = "Build reviewed Tournament Trophy art without silent overwrite"
run = "pnpm assets:trophies"

[tasks."assets:music"]
description = "Sync supplied music into stable public soundtrack paths"
run = "pnpm assets:music"

[tasks."content:validate"]
description = "Validate authored game content"
run = "pnpm content:validate"

[tasks."demo:capture"]
description = "Capture a music-mixed 1920x1080 gameplay demonstration"
run = "pnpm demo:capture"

[tasks."demo:trailer"]
description = "Render the branded 1920x1080 gameplay trailer"
run = "pnpm demo:trailer"

[tasks."video:check"]
description = "Lint and type-check the Remotion trailer project"
run = "pnpm video:check"

[tasks."performance:audit"]
description = "Build and measure the cold production mobile intro boundary"
run = "pnpm performance:audit"

[tasks.check]
description = "Run the complete local quality gate"
depends = ["lint", "format", "typecheck", "test", "build", "content:validate", "video:check"]
